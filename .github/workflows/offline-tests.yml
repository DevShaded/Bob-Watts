name: Offline tests

on: [push, pull_request]

permissions:
    contents: read

jobs:
    test:
        name: Offline tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Install dependencies and generate Prisma Client
              run: npm ci
            - name: Build migrated production TypeScript from clean output
              run: |
                  test ! -e dist
                  npm run build:typed
            - name: Smoke-test production resources before compiling tests
              run: npm run smoke:typed
            - name: Lint migrated TypeScript sources and tests
              run: npm run lint:typed
            - name: Run offline tests
              run: npm test
