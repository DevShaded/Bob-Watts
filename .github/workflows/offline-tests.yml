name: Offline tests

on: [push, pull_request]

permissions:
    contents: read

jobs:
    test:
        name: Offline tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Install dependencies and generate Prisma Client
              run: npm ci
            - name: Run offline tests
              run: npm test
